name: APK build (EAS)

# Telefonga o'rnatiladigan standalone APK ni Expo bulutida yig'adi.
# FAQAT QO'LDA ishga tushiriladi (native o'zgarish bo'lganda). Kundalik JS o'zgarishlar
# uchun APK kerak emas — 'OTA update (EAS)' workflow havodan yangilaydi.
# Shart: repo Settings → Secrets → Actions'da EXPO_TOKEN.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profili"
        required: true
        default: preview
        type: choice
        options: [preview, production]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build Android APK
        run: eas build --platform android --profile ${{ github.event.inputs.profile || 'preview' }} --non-interactive
