name: APK build (EAS)

# Telefonga o'rnatiladigan standalone APK ni Expo bulutida yig'adi.
# Yagona shart: repo Settings → Secrets and variables → Actions'da EXPO_TOKEN qo'shilgan.
# Ishga tushirish: shu branch'ga push, yoki Actions → "APK build (EAS)" → Run workflow.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profili"
        required: true
        default: preview
        type: choice
        options: [preview, production]
  push:
    branches: [claude/tartib-dc-html-wacqog]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Link/create EAS project
        run: eas init --non-interactive --force

      - name: Build Android APK
        run: eas build --platform android --profile ${{ github.event.inputs.profile || 'preview' }} --non-interactive
